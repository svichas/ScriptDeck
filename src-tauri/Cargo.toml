[package]
name = "scriptdeck"
version = "0.4.1"
description = "A menu bar app for running your package.json scripts in the background"
license = "MIT"
repository = "https://github.com/svichas/ScriptDeck"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
portable-pty = "0.9"
glob = "0.3"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Asks macOS whether ScriptDeck may notify, which the notification plugin can't; Tauri already builds the first three.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSError", "NSString"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "UNNotificationSettings", "UNUserNotificationCenter"] }

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
strip = true
panic = "abort"
